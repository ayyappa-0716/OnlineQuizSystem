<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Online Quiz System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5365d6;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .password-requirements {
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 18px;
        }

        .password-requirements p {
            color: gray;
            margin: 5px 0;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h2>Student Registration</h2>

        <p class="subtitle">
            Create your account to access the Online Quiz System
        </p>

        <form id="registerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

       <div class="password-field">
          <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
          >    

          <button type="button" class="toggle-password"
              onclick="togglePassword('password', this)">
              Show
          </button>
        </div>

            <div class="password-requirements">
                <p id="lengthCheck">○ At least 8 characters</p>
                <p id="upperCheck">○ One uppercase letter (A-Z)</p>
                <p id="lowerCheck">○ One lowercase letter (a-z)</p>
                <p id="numberCheck">○ One number (0-9)</p>
                <p id="specialCheck">○ One special character (@, #, $, etc.)</p>
            </div>

            <label for="confirmPassword">Confirm Password</label>

<div class="password-field">
    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        required
    >

    <button type="button" class="toggle-password"
        onclick="togglePassword('confirmPassword', this)">
        Show
    </button>
</div>

<p id="passwordMatchMessage"
   style="font-size: 13px; margin-top: -12px; margin-bottom: 18px;">
</p>

            <button type="submit" id="registerButton">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login Here</a>
        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
