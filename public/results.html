
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quiz History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #243b55;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .summary-card {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .summary-card h3 {
            color: #243b55;
        }

        .summary-card p {
            font-size: 25px;
            font-weight: bold;
        }

        .result-card {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .result-card h3 {
            color: #243b55;
        }

        button {
            background-color: #243b55;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #141e30;
        }

        #resultsList {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Quiz System</h1>
        <h2>My Quiz History</h2>
    </header>

    <div class="container">

        <h2 id="welcomeMessage">My Results</h2>

        <div class="summary">

            <div class="summary-card">
                <h3>Total Attempts</h3>
                <p id="totalAttempts">0</p>
            </div>

            <div class="summary-card">
                <h3>Passed</h3>
                <p id="passedQuizzes">0</p>
            </div>

            <div class="summary-card">
                <h3>Failed</h3>
                <p id="failedQuizzes">0</p>
            </div>

            <div class="summary-card">
                <h3>Average Percentage</h3>
                <p id="averagePercentage">0%</p>
            </div>

        </div>

        <h2>Previous Quiz Attempts</h2>

        <div id="resultsList">
            Loading quiz history...
        </div>

        <button onclick="window.location.href='dashboard.html'">
            Back to Dashboard
        </button>

    </div>

    <script src="js/results.js"></script>

</body>
</html>
